[package]
name = "myrtle-api"
description = "L6: the HTTP API binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "myrtle-api"
path = "src/main.rs"

[dependencies]
myrtle-types.workspace = true
myrtle-app.workspace = true
myrtle-db.workspace = true
myrtle-engine-squad.workspace = true
myrtle-engine-planner.workspace = true
myrtle-engine-release.workspace = true
myrtle-engine-story.workspace = true
myrtle-gamedata.workspace = true
myrtle-gamedata-raw.workspace = true
myrtle-hypergryph.workspace = true
myrtle-storage.workspace = true
axum.workspace = true
chrono.workspace = true
dashmap.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
tokio-util = { workspace = true, features = ["io"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
ts-rs.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
myrtle-gamedata.workspace = true
myrtle-jobs.workspace = true
myrtle-testkit.workspace = true
reqwest.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
toml.workspace = true

[lints]
workspace = true
