[package]
name = "myrtle-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"  # std File::try_lock for the per-server sync lock
description = "S3-compatible object storage for Myrtle's served assets, and the asset-sync binary"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "asset-sync"
path = "src/bin/asset-sync.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.92"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.1"
aws-sdk-s3 = "1.154.0"
aws-smithy-types = "1.9.0"
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dotenv = "0.15.0"
futures = "0.3.34"
hex = "0.4"
md-5 = "0.10.6"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
