allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
disallowed-methods = [
    { path = "std::env::var", reason = "engines take configuration as an input value, see app::config" },
    { path = "std::env::var_os", reason = "engines take configuration as an input value, see app::config" },
    { path = "std::fs::read", reason = "engines take a GameModel or bytes, never a path" },
    { path = "std::fs::read_to_string", reason = "engines take a GameModel or bytes, never a path" },
    { path = "std::fs::read_dir", reason = "engines take a GameModel or bytes, never a path" },
    { path = "std::fs::write", reason = "engines return values; the caller persists them" },
    { path = "std::time::SystemTime::now", reason = "pass `now` in the inputs so results are reproducible" },
    { path = "std::time::Instant::now", reason = "timing belongs to the caller (tracing spans in app/worker)" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "engines take a GameModel or bytes, never a path" },
]
