name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  # No SQLX_OFFLINE: the .sqlx query cache is not committed, so every job that
  # compiles crates/db gets a Postgres service and a DATABASE_URL instead.
  # Opt into Node.js 24 for GitHub Actions (avoids Node.js 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Formatting check
  # ──────────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check backend formatting
        working-directory: backend
        run: cargo fmt --check

  # ──────────────────────────────────────────────────────────────────────────────
  # Linting
  # ──────────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/myrtle_sqlx
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: clippy
          cache-on-failure: true

      # The sqlx query macros in crates/db check every query against this
      # schema at compile time (backend/.gitignore keeps .sqlx out of git).
      - name: Load the migrated schema
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -qc 'CREATE DATABASE myrtle_sqlx'
          for f in backend/crates/db/migrations/*.sql; do
            psql -h localhost -U postgres -d myrtle_sqlx -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      - name: Lint backend
        working-directory: backend
        # Lint levels come from [workspace.lints] in backend/Cargo.toml
        run: cargo clippy --workspace -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────────
  # Compilation check
  # ──────────────────────────────────────────────────────────────────────────────
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/myrtle_sqlx
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: check
          cache-on-failure: true

      # The sqlx query macros in crates/db check every query against this
      # schema at compile time (backend/.gitignore keeps .sqlx out of git).
      - name: Load the migrated schema
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -qc 'CREATE DATABASE myrtle_sqlx'
          for f in backend/crates/db/migrations/*.sql; do
            psql -h localhost -U postgres -d myrtle_sqlx -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      - name: Check backend compilation
        working-directory: backend
        run: cargo check --workspace --all-targets

  # ──────────────────────────────────────────────────────────────────────────────
  # Tests (needs game data from the assets pipeline and a Postgres)
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/myrtle_sqlx
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: test
          cache-on-failure: true

      # The sqlx query macros in crates/db check every query against this
      # schema at compile time (backend/.gitignore keeps .sqlx out of git).
      - name: Load the migrated schema
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -qc 'CREATE DATABASE myrtle_sqlx'
          for f in backend/crates/db/migrations/*.sql; do
            psql -h localhost -U postgres -d myrtle_sqlx -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      # Produced by assets-ci.yml's Integration job on every non-PR run (see the
      # "Game data for backend CI" block there). The artifact root is the contents
      # of `output/en/gamedata/`, so it lands at the same path a local install uses.
      - name: Download game data from assets pipeline
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: assets-ci.yml
          name: game-data
          path: assets/output/en/gamedata
          branch: ${{ github.base_ref || github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: fail

      # The story-art sprite packs from the same Integration job, so the
      # tier-list art checks run here too. Optional: without them those checks
      # skip on the missing `textures/spritepack` and everything else still runs.
      - name: Download story art from assets pipeline
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: assets-ci.yml
          name: story-art
          path: assets/output/en/textures/spritepack
          branch: ${{ github.base_ref || github.ref_name }}
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Verify game data exists
        run: |
          if [ ! -s "assets/output/en/gamedata/excel/character_table.json" ]; then
            echo "::error::Game data not found; the DPS/HPS parity suites cannot run."
            echo "::error::Run assets-ci.yml (workflow_dispatch) on this branch, then re-run this job."
            find assets/output -maxdepth 4 | head -20
            exit 1
          fi
          echo "Game data found"
          ls assets/output/en/gamedata/excel/ | head -10

      - name: Run tests
        working-directory: backend
        env:
          MYRTLE_TEST_ASSETS: ${{ github.workspace }}/assets/output
          RUST_BACKTRACE: 1
        # sqlx::test and the testkit create a throwaway database per test on
        # the server DATABASE_URL names. myrtle-dps-transpile is excluded: its
        # tests read backend/external/ArknightsDpsCompare, a gitignored local
        # checkout that CI does not have.
        run: cargo test --workspace --exclude myrtle-dps-transpile -- --nocapture

  # ──────────────────────────────────────────────────────────────────────────────
  # Release build
  # ──────────────────────────────────────────────────────────────────────────────
  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/myrtle_sqlx
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: release
          cache-on-failure: true

      # The sqlx query macros in crates/db check every query against this
      # schema at compile time (backend/.gitignore keeps .sqlx out of git).
      - name: Load the migrated schema
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -qc 'CREATE DATABASE myrtle_sqlx'
          for f in backend/crates/db/migrations/*.sql; do
            psql -h localhost -U postgres -d myrtle_sqlx -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      # myrtle-cli builds the `myrtle` binary; myrtle-storage builds asset-sync,
      # which vps-update.sh installs for the asset watchers.
      - name: Build binaries (release)
        working-directory: backend
        run: cargo build --release -p myrtle-api -p myrtle-worker -p myrtle-cli -p myrtle-storage

      - name: Verify binaries exist
        run: |
          for bin in myrtle-api myrtle-worker myrtle asset-sync; do
            test -x "backend/target/release/$bin"
          done
          echo "All binaries built successfully"

      - name: Upload binaries
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3'
        uses: actions/upload-artifact@v7
        with:
          name: backend-release-binaries
          path: |
            backend/target/release/myrtle-api
            backend/target/release/myrtle-worker
            backend/target/release/myrtle
            backend/target/release/asset-sync
            !backend/target/release/.fingerprint/**
            !backend/target/release/build/**
            !backend/target/release/deps/**
            !backend/target/release/examples/**
            !backend/target/release/incremental/**
            !backend/target/release/*.d
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Security audit
  # ──────────────────────────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit backend
        working-directory: backend
        run: cargo audit || echo "::warning::Backend audit found vulnerabilities"

  # ──────────────────────────────────────────────────────────────────────────────
  # Final status
  # ──────────────────────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    if: always()
    needs: [fmt, clippy, check, test, build-release, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results=(
            "${{ needs.fmt.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.check.result }}"
            "${{ needs.test.result }}"
            "${{ needs.build-release.result }}"
            "${{ needs.audit.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::Job failed with result: $result"
              exit 1
            fi
          done
          echo "All jobs passed!"
