name: Schema Watch

# A game patch that changes a FlatBuffer schema makes the affected gamedata tables verify
# under no schema. The unpacker then skips them and keeps the previous extraction, so the
# site serves stale tables until the schemas are updated (CN 2.7.81 on 2026-10-09:
# activity_table, building_data, roguelike_topic_table; EN 26-10-03 on 2026-10-14:
# activity_table, so the release planner never saw Critical Phase Transition).
#
# Schemas live in the repository, in assets/schemas (see its README), and come from the
# game itself, with no third-party repository anywhere in the loop:
#   - the CN set is GENERATED by `unpacker schema-gen` from the official CN Windows client
#     (GameAssembly.dll + global-metadata.dat, about 264 MB, served per file and without
#     authentication by Hypergryph's launcher CDN; `downloader client-download` fetches them);
#   - the Yostar (EN/JP/KR) variants are RESOLVED by `unpacker schema-sync`, which tries the
#     CN schema and then every version in assets/schemas/history (newest first) against the
#     live binaries and keeps the first the production verifier accepts.
# assets/schemas/schemas.lock.json records the client version and the server resVersions
# the store was last generated and resolved against.
#
# This job closes the gap without a human in the loop up to the PR:
#   1. compare the launcher's CN client version and every server's resVersion against the
#      lock, with no download; stop if nothing moved and the run was not forced;
#   2. if the client moved, download it and regenerate the CN schemas; download the live
#      gamedata bundles of every reachable server and verify them with the pinned schemas
#      (the "before" matrix); run schema-sync, generate-fbs, rebuild;
#   3. verify again: a table that verified before and fails now is a REGRESSION and stops
#      the job; a table still verifying under no schema is only a warning, so one lagging
#      server never blocks a fix for the others;
#   4. extract every server's gamedata as a smoke test;
#   5. if only the lock moved (same schemas, newer versions) commit it straight to main: the
#      lock is provenance, nothing builds from it; otherwise open (or update) a PR with the
#      before/after matrix;
#   6. run Assets CI on the PR head and squash-merge it when green (the `automerge` job).
# Auto-merge kill switch: set the repository variable SCHEMA_WATCH_AUTOMERGE=false and the PR
# waits for a human instead. Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General), or the PR step fails.
#
# Failure modes a human must look at (the job fails loudly, nothing merges):
#   - `schema-gen` exits 3: the client's metadata or binary changed shape (a Unity upgrade,
#     a new obfuscation, a protector change). The store keeps working at its last state.
#   - `schema-sync` exits 2: a table that resolved before resolves under no candidate now.
#   - the after-verify finds a regression.
# A PR whose report lists existing fields that changed TYPE is opened and tested but not
# auto-merged (output `review`), because such a schema verifies and decodes garbage.
# A server whose version endpoint does not answer is skipped for that run with a warning,
# so one dead endpoint does not stop the others.
#
# The Rust toolchain is pinned (here and in assets-ci.yml) so that a new stable's lints or
# codegen cannot break an unattended run; bump both deliberately.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate and resolve even if the client and every server are at the lock's versions"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schema-watch
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Must match the flatbuffers crate in assets/unpacker/Cargo.toml; generated code from a
  # different flatc differs line for line.
  FLATC_VERSION: "25.12.19"
  SERVERS: "cn en jp kr"
  LAUNCHER_API: "https://launcher.hypergryph.com/api/game/get_latest?appcode=GzD1CpaWgmSq1wew&channel=1&sub_channel=1&platform=Windows"
  LOCK: "assets/schemas/schemas.lock.json"

jobs:
  watch:
    name: Detect schema drift, regenerate and resolve
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      pr-number: ${{ steps.pr.outputs.pull-request-number }}
      pr-operation: ${{ steps.pr.outputs.pull-request-operation }}
      pr-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
      review: ${{ steps.change.outputs.review }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            assets/downloader -> target
            assets/unpacker -> target
          key: schema-watch

      - name: Build downloader + unpacker
        run: |
          cargo build --release --manifest-path assets/downloader/Cargo.toml
          cargo build --release --manifest-path assets/unpacker/Cargo.toml --bin unpacker

      - name: Compare the client and server versions with the lock
        id: decide
        env:
          FORCE: ${{ inputs.force }}
        # Nothing is downloaded here: one launcher JSON and one version probe per server.
        # Versions are third-party text: they go to files and outputs, never into an
        # expression. A server that does not answer is dropped from this run with a
        # warning; the launcher not answering means the CN schemas are not regenerated
        # this run, the Yostar side still resolves.
        run: |
          : > "$RUNNER_TEMP/reasons.md"
          moved=false
          regen=false
          lock_client=$(jq -r '.client.version // empty' "$LOCK")
          client=$(curl -sS --max-time 30 "$LAUNCHER_API" | jq -r '.client_version // empty' || true)
          if [ -z "$client" ]; then
            echo "::warning::the launcher did not answer; the CN client is not regenerated this run"
          elif [ "$client" != "$lock_client" ]; then
            moved=true
            regen=true
            printf -- '- CN client: `%s` -> `%s`\n' "${lock_client:-none}" "$client" >> "$RUNNER_TEMP/reasons.md"
          fi
          active=""
          for s in $SERVERS; do
            lock_rv=$(jq -r ".servers.\"$s\".resVersion // empty" "$LOCK")
            rv=$(assets/downloader/target/release/downloader -s "$s" check-update 2>/dev/null | awk '/^Client:/ {print $NF}' || true)
            if [ -z "$rv" ]; then
              echo "::warning::$s: the version endpoint did not answer; $s is skipped this run"
              continue
            fi
            active="$active $s"
            if [ "$rv" != "$lock_rv" ]; then
              moved=true
              printf -- '- %s resVersion: `%s` -> `%s`\n' "$s" "${lock_rv:-none}" "$rv" >> "$RUNNER_TEMP/reasons.md"
            fi
          done
          active=$(echo "$active" | xargs)
          test -n "$active" || { echo "::error::no server answered"; exit 1; }
          cat "$RUNNER_TEMP/reasons.md"
          echo "servers=$active" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] && [ -n "$client" ]; then regen=true; fi
          echo "regen=$regen" >> "$GITHUB_OUTPUT"
          if [ "$moved" = "true" ] || [ "$FORCE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The client and every server are at the lock's versions; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flatc ${{ env.FLATC_VERSION }}
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api "repos/google/flatbuffers/releases/tags/v$FLATC_VERSION" \
            --jq '[.assets[].name | select(startswith("Linux.flatc.binary"))][0]')
          test -n "$asset" || { echo "no Linux flatc asset for v$FLATC_VERSION"; exit 1; }
          gh release download "v$FLATC_VERSION" -R google/flatbuffers -p "$asset" -D "$RUNNER_TEMP/flatc"
          unzip -q "$RUNNER_TEMP/flatc/$asset" -d "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc/flatc"
          echo "$RUNNER_TEMP/flatc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flatc/flatc" --version | grep -q "$FLATC_VERSION"

      - name: Download the CN client and regenerate the CN schemas
        id: gen
        if: steps.decide.outputs.run == 'true' && steps.decide.outputs.regen == 'true'
        # Exit 3 from schema-gen means the client changed shape (metadata version, type
        # row stride, registration layout): the store keeps its last state and a human
        # must look. Any other failure is a tool error.
        run: |
          assets/downloader/target/release/downloader -s cn client-download -d "$RUNNER_TEMP/client" --platform windows
          set +e
          assets/unpacker/target/release/unpacker schema-gen \
            --client "$RUNNER_TEMP/client" --out "$RUNNER_TEMP/gen" --roots assets/schemas/roots.json
          rc=$?
          set -e
          cat "$RUNNER_TEMP/gen/schema-gen.json" 2>/dev/null || true
          case "$rc" in
            0) ;;
            3) echo "::error::schema-gen: the client's metadata or binary changed shape; the schemas were not regenerated (see above)"; exit 3 ;;
            *) echo "::error::schema-gen failed with exit code $rc"; exit "$rc" ;;
          esac
          missing=$(jq -r '.missing_roots // [] | join(" ")' "$RUNNER_TEMP/gen/schema-gen.json")
          discovered=$(jq -r '[.discovered // [] | .[] | .class] | join(" ")' "$RUNNER_TEMP/gen/schema-gen.json")
          [ -z "$missing" ] || echo "::warning::root types absent from the client (the stored file is kept): $missing"
          [ -z "$discovered" ] || echo "::warning::table types in the client that assets/schemas/roots.json does not map yet: $discovered"

      - name: Download live gamedata
        if: steps.decide.outputs.run == 'true'
        env:
          ACTIVE: ${{ steps.decide.outputs.servers }}
        run: |
          for s in $ACTIVE; do
            assets/downloader/target/release/downloader -s "$s" -d "$RUNNER_TEMP/ark/$s" \
              download --all --profile gamedata
          done

      - name: Verify with the pinned schemas
        if: steps.decide.outputs.run == 'true'
        env:
          ACTIVE: ${{ steps.decide.outputs.servers }}
        run: |
          dir="$RUNNER_TEMP/verify/before"
          mkdir -p "$dir"
          for s in $ACTIVE; do
            assets/unpacker/target/release/unpacker verify -i "$RUNNER_TEMP/ark/$s" > "$dir/$s.txt" 2>&1
            { grep 'chosen: none' "$dir/$s.txt" || true; } | awk '{print $1}' | sort > "$dir/$s.names"
            echo "$s: $(wc -l < "$dir/$s.names") table(s) verify under no schema" $(cat "$dir/$s.names")
          done

      - name: Resolve schemas against the live binaries
        if: steps.decide.outputs.run == 'true'
        env:
          ACTIVE: ${{ steps.decide.outputs.servers }}
          REGEN: ${{ steps.decide.outputs.regen }}
        # Exit 2 means a table that resolved in the previous lock resolves under no
        # candidate now: that is a regression in the game or in the generator, and a
        # human should look before anything merges. Exit 1 is a tool error.
        run: |
          bundles=""
          for s in $ACTIVE; do bundles="$bundles --bundles $s=$RUNNER_TEMP/ark/$s"; done
          generated=""
          [ "$REGEN" = "true" ] && generated="--generated $RUNNER_TEMP/gen"
          set +e
          assets/unpacker/target/release/unpacker schema-sync \
            --store assets/schemas $generated $bundles --report "$RUNNER_TEMP/sync-report.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/sync-report.md"
          case "$rc" in
            0) ;;
            2) echo "::error::schema-sync: a previously resolved table resolves under no candidate (see the report above)"; exit 2 ;;
            *) echo "::error::schema-sync failed with exit code $rc"; exit "$rc" ;;
          esac

      - name: Regenerate the decoder and rebuild
        if: steps.decide.outputs.run == 'true'
        run: |
          cargo run --release --manifest-path assets/unpacker/Cargo.toml --bin generate-fbs
          cargo fmt --manifest-path assets/unpacker/Cargo.toml
          cargo build --release --manifest-path assets/unpacker/Cargo.toml --bin unpacker

      - name: Verify with the resolved schemas
        if: steps.decide.outputs.run == 'true'
        env:
          ACTIVE: ${{ steps.decide.outputs.servers }}
        run: |
          before="$RUNNER_TEMP/verify/before"
          after="$RUNNER_TEMP/verify/after"
          mkdir -p "$after"
          regressed=0
          : > "$RUNNER_TEMP/matrix.md"
          for s in $ACTIVE; do
            assets/unpacker/target/release/unpacker verify -i "$RUNNER_TEMP/ark/$s" > "$after/$s.txt" 2>&1
            { grep 'chosen: none' "$after/$s.txt" || true; } | awk '{print $1}' | sort > "$after/$s.names"
            new=$(comm -13 "$before/$s.names" "$after/$s.names" | xargs)
            still=$(comm -12 "$before/$s.names" "$after/$s.names" | xargs)
            fixed=$(comm -23 "$before/$s.names" "$after/$s.names" | xargs)
            echo "| $s | ${fixed:--} | ${still:--} | ${new:--} |" >> "$RUNNER_TEMP/matrix.md"
            if [ -n "$new" ]; then
              echo "::error::$s: verified under the pinned schemas but fails after resolving: $new"
              regressed=1
            fi
            if [ -n "$still" ]; then
              echo "::warning::$s: still verifies under no schema (no known layout fits yet; the VPS keeps the previous extraction): $still"
            fi
          done
          cat "$RUNNER_TEMP/matrix.md"
          exit "$regressed"

      - name: Smoke-extract every server's gamedata
        if: steps.decide.outputs.run == 'true'
        env:
          ACTIVE: ${{ steps.decide.outputs.servers }}
        run: |
          for s in $ACTIVE; do
            idx=$(ls "$RUNNER_TEMP"/ark/$s/*.idx | head -1)
            assets/unpacker/target/release/unpacker extract -i "$RUNNER_TEMP/ark/$s" \
              -o "$RUNNER_TEMP/out/$s" --gamedata --idx "$idx"
            python3 -I - "$s" "$RUNNER_TEMP/out/$s/gamedata/excel" "$RUNNER_TEMP/verify/after/$s.names" <<'PY'
          import json, pathlib, sys
          server, d, skipped = sys.argv[1], pathlib.Path(sys.argv[2]), set(pathlib.Path(sys.argv[3]).read_text().split())
          files = sorted(d.glob("*.json"))
          bad = []
          for f in files:
              text = f.read_text(encoding="utf-8")
              json.loads(text)
              if "\\u0000" in text:
                  bad.append(f.name)
          print(f"{server}: {len(files)} tables parse as JSON")
          # A table no known layout fits yet is skipped by design; every other must exist.
          for need in ("activity_table", "building_data", "roguelike_topic_table", "character_table", "skin_table"):
              if need not in skipped and not (d / f"{need}.json").exists():
                  sys.exit(f"{server}: missing {need}.json")
          if bad:
              sys.exit(f"{server}: escaped NULs (a misaligned decode) in: {', '.join(bad)}")
          PY
          done

      - name: Classify the change
        id: change
        if: steps.decide.outputs.run == 'true'
        # Schema or decoder changes go through a PR and Assets CI. A change to the lock
        # alone (the same schemas verified against newer versions) is provenance:
        # nothing is built from the lock, so it is committed to main directly.
        run: |
          git add -A assets/schemas assets/unpacker/src
          if git diff --cached --quiet; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "Nothing changed on disk."
          elif git diff --cached --quiet -- assets/schemas/cn assets/schemas/yostar assets/schemas/history assets/unpacker/src; then
            echo "kind=lock" >> "$GITHUB_OUTPUT"
            echo "Only the lock changed."
          else
            echo "kind=schemas" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -1
          fi
          git reset --quiet
          # An existing field whose TYPE changed between the stored and the generated schema
          # verifies like any other schema and would decode garbage silently. schema-sync
          # lists such changes in the report; the PR still opens and Assets CI still runs,
          # but auto-merge is withheld so a human reads the list first.
          if grep -q '^## Field type changes (' "$RUNNER_TEMP/sync-report.md"; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            echo "::warning::existing fields changed type; auto-merge is withheld for this PR (see the report)"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        if: steps.decide.outputs.run == 'true' && steps.change.outputs.kind != 'none'
        run: |
          {
            echo "Why this run resolved:"
            echo
            cat "$RUNNER_TEMP/reasons.md"
            echo
            if [ -f "$RUNNER_TEMP/gen/schema-gen.json" ]; then
              echo "CN schemas regenerated from the official client:"
              echo
              echo '```json'
              cat "$RUNNER_TEMP/gen/schema-gen.json"
              echo '```'
              echo
            fi
            cat "$RUNNER_TEMP/sync-report.md"
            echo
            echo "| server | fixed | still failing (no known layout) | regressed |"
            echo "|---|---|---|---|"
            cat "$RUNNER_TEMP/matrix.md"
            echo
            echo "Every server's gamedata extracts and parses as JSON with no escaped NULs. A table still failing keeps its previous extraction on the VPS until a layout that fits exists."
            if grep -q '^## Field type changes (' "$RUNNER_TEMP/sync-report.md"; then
              echo
              echo "**Auto-merge withheld:** existing fields changed type (listed above). Check the decode of those tables before merging."
            fi
            echo
            echo "After merging, run \`vps-update.sh\` on the VPS: it rebuilds the unpacker, and the watcher re-extracts because the binary is newer than \`.last_extract\`."
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the lock to main
        if: steps.decide.outputs.run == 'true' && steps.change.outputs.kind == 'lock'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOCK"
          git commit -q -F - <<'MSG'
          chore(schemas): record the versions the store was verified against

          Same schemas, newer client or server versions. The lock is provenance only; nothing is built from it.
          MSG
          git pull --rebase --quiet origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Open PR
        id: pr
        if: steps.decide.outputs.run == 'true' && steps.change.outputs.kind == 'schemas'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: schema-watch/fbs-bump
          title: "chore(unpacker): regenerate FlatBuffer schemas from the game client"
          commit-message: "chore(unpacker): regenerate FlatBuffer schemas from the game client"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            assets/schemas
            assets/unpacker/src
          delete-branch: true

  # A PR opened with GITHUB_TOKEN triggers no pull_request workflows, so Assets CI would never
  # run on it. workflow_dispatch is the one event GITHUB_TOKEN may start, so this job
  # dispatches Assets CI on the PR branch, waits for that exact commit's run, and merges only
  # that commit (--match-head-commit: a push after the run started aborts the merge). Required
  # status checks would do the same for every PR, but Assets CI is path-filtered and would
  # leave unrelated PRs waiting forever.
  automerge:
    name: Merge once Assets CI passes
    needs: watch
    if: >-
      needs.watch.outputs.pr-number != '' &&
      needs.watch.outputs.pr-operation != 'closed' &&
      needs.watch.outputs.review != 'true' &&
      vars.SCHEMA_WATCH_AUTOMERGE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: schema-watch/fbs-bump
      PR: ${{ needs.watch.outputs.pr-number }}
      SHA: ${{ needs.watch.outputs.pr-sha }}
    steps:
      - name: Run Assets CI on the PR head
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run assets-ci.yml --ref "$BRANCH"
          id=""
          for _ in $(seq 1 30); do
            sleep 10
            id=$(gh run list --workflow assets-ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$SHA\" and .createdAt >= \"$started\")][0].databaseId // empty")
            [ -n "$id" ] && break
          done
          test -n "$id" || { echo "::error::the dispatched Assets CI run for $SHA never appeared"; exit 1; }
          echo "Assets CI: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
          gh run watch "$id" --exit-status --interval 60 > /dev/null

      - name: Merge
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"
