name: Schema Watch

# A game patch that changes a FlatBuffer schema makes the affected gamedata tables verify
# under no schema. The unpacker then skips them and keeps the previous extraction, so the
# site serves stale tables until the schemas are regenerated (CN 2.7.81 on 2026-10-09:
# activity_table, building_data, roguelike_topic_table; EN 26-10-03 on 2026-10-14:
# activity_table, so the release planner never saw Critical Phase Transition).
#
# Schemas come from two upstreams, both pinned submodules:
#   assets/OpenArknightsFBS      CN
#   assets/ArknightsFlatbuffers  Yostar (EN/JP/KR) variants, generated from the CN one
#
# This job closes that gap without a human in the loop up to the PR:
#   1. download the live gamedata bundles of every server and run `unpacker verify`;
#   2. if a table verifies under no schema, or either upstream has moved past its pinned
#      commit, bring both to upstream HEAD, run generate-fbs and rebuild;
#   3. verify again: a table that verified before and fails now is a REGRESSION and stops
#      the job; a table upstream has not fixed yet is only a warning, so one lagging server
#      never blocks a fix for the others (EN was fixed upstream on 2026-10-09 but sat
#      unshipped for days because JP/KR still failed);
#   4. extract every server's gamedata as a smoke test;
#   5. open (or update) a PR with the before/after matrix;
#   6. run Assets CI on the PR head and squash-merge it when green (the `automerge` job).
# Auto-merge kill switch: set the repository variable SCHEMA_WATCH_AUTOMERGE=false and the PR
# waits for a human instead. Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General), or the PR step fails.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if every table verifies and upstream has not moved"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schema-watch
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Must match the flatbuffers crate in assets/unpacker/Cargo.toml; generated code from a
  # different flatc differs line for line.
  FLATC_VERSION: "25.12.19"
  SERVERS: "cn en jp kr"
  SCHEMA_REPOS: "OpenArknightsFBS ArknightsFlatbuffers"

jobs:
  watch:
    name: Detect schema drift and regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      pr-number: ${{ steps.pr.outputs.pull-request-number }}
      pr-operation: ${{ steps.pr.outputs.pull-request-operation }}
      pr-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            assets/downloader -> target
            assets/unpacker -> target
          key: schema-watch

      - name: Build downloader + unpacker
        run: |
          cargo build --release --manifest-path assets/downloader/Cargo.toml
          cargo build --release --manifest-path assets/unpacker/Cargo.toml --bin unpacker

      - name: Download live gamedata
        run: |
          for s in $SERVERS; do
            assets/downloader/target/release/downloader download --all -s "$s" \
              --profile gamedata -d "$RUNNER_TEMP/ark/$s"
          done

      - name: Verify with the pinned schemas
        id: before
        run: |
          dir="$RUNNER_TEMP/verify/before"
          mkdir -p "$dir"
          broken=0
          for s in $SERVERS; do
            assets/unpacker/target/release/unpacker verify -i "$RUNNER_TEMP/ark/$s" > "$dir/$s.txt" 2>&1
            { grep 'chosen: none' "$dir/$s.txt" || true; } | awk '{print $1}' | sort > "$dir/$s.names"
            n=$(wc -l < "$dir/$s.names")
            echo "$s: $n table(s) verify under no schema" $(cat "$dir/$s.names")
            broken=$((broken + n))
          done
          echo "broken=$broken" >> "$GITHUB_OUTPUT"

      - name: Check upstream schemas
        id: upstream
        # Commit subjects are third-party text: they go to a file, never into an expression,
        # where they would run as shell with this job's write token.
        run: |
          moved=false
          : > "$RUNNER_TEMP/upstream.md"
          for repo in $SCHEMA_REPOS; do
            d="assets/$repo"
            git -C "$d" fetch --quiet --depth 1 origin HEAD
            pinned=$(git -C "$d" rev-parse HEAD)
            latest=$(git -C "$d" rev-parse FETCH_HEAD)
            [ "$pinned" = "$latest" ] || moved=true
            printf -- '- %s: `%.7s` -> `%.7s` (%s)\n' "$repo" "$pinned" "$latest" \
              "$(git -C "$d" log -1 --format=%s FETCH_HEAD)" >> "$RUNNER_TEMP/upstream.md"
          done
          cat "$RUNNER_TEMP/upstream.md"
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          BROKEN: ${{ steps.before.outputs.broken }}
          MOVED: ${{ steps.upstream.outputs.moved }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$BROKEN" != "0" ] || [ "$MOVED" = "true" ] || [ "$FORCE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Every table verifies and both upstreams are at the pinned commits; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flatc ${{ env.FLATC_VERSION }}
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api "repos/google/flatbuffers/releases/tags/v$FLATC_VERSION" \
            --jq '[.assets[].name | select(startswith("Linux.flatc.binary"))][0]')
          test -n "$asset" || { echo "no Linux flatc asset for v$FLATC_VERSION"; exit 1; }
          gh release download "v$FLATC_VERSION" -R google/flatbuffers -p "$asset" -D "$RUNNER_TEMP/flatc"
          unzip -q "$RUNNER_TEMP/flatc/$asset" -d "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc/flatc"
          echo "$RUNNER_TEMP/flatc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flatc/flatc" --version | grep -q "$FLATC_VERSION"

      - name: Bump schemas and regenerate
        if: steps.decide.outputs.run == 'true'
        # generate-fbs brings both submodules to upstream HEAD (fetch + detach, safe on this
        # shallow, detached checkout) before generating.
        run: |
          cargo run --release --manifest-path assets/unpacker/Cargo.toml --bin generate-fbs
          cargo fmt --manifest-path assets/unpacker/Cargo.toml
          cargo build --release --manifest-path assets/unpacker/Cargo.toml --bin unpacker

      - name: Verify with the regenerated schemas
        if: steps.decide.outputs.run == 'true'
        run: |
          before="$RUNNER_TEMP/verify/before"
          after="$RUNNER_TEMP/verify/after"
          mkdir -p "$after"
          regressed=0
          : > "$RUNNER_TEMP/matrix.md"
          for s in $SERVERS; do
            assets/unpacker/target/release/unpacker verify -i "$RUNNER_TEMP/ark/$s" > "$after/$s.txt" 2>&1
            { grep 'chosen: none' "$after/$s.txt" || true; } | awk '{print $1}' | sort > "$after/$s.names"
            new=$(comm -13 "$before/$s.names" "$after/$s.names" | xargs)
            still=$(comm -12 "$before/$s.names" "$after/$s.names" | xargs)
            fixed=$(comm -23 "$before/$s.names" "$after/$s.names" | xargs)
            echo "| $s | ${fixed:--} | ${still:--} | ${new:--} |" >> "$RUNNER_TEMP/matrix.md"
            if [ -n "$new" ]; then
              echo "::error::$s: verified under the pinned schemas but fails after regenerating: $new"
              regressed=1
            fi
            if [ -n "$still" ]; then
              echo "::warning::$s: still verifies under no schema (upstream has not caught up; the VPS keeps the previous extraction): $still"
            fi
          done
          cat "$RUNNER_TEMP/matrix.md"
          exit "$regressed"

      - name: Smoke-extract every server's gamedata
        if: steps.decide.outputs.run == 'true'
        run: |
          for s in $SERVERS; do
            idx=$(ls "$RUNNER_TEMP"/ark/$s/*.idx | head -1)
            assets/unpacker/target/release/unpacker extract -i "$RUNNER_TEMP/ark/$s" \
              -o "$RUNNER_TEMP/out/$s" --gamedata --idx "$idx"
            python3 -I - "$s" "$RUNNER_TEMP/out/$s/gamedata/excel" "$RUNNER_TEMP/verify/after/$s.names" <<'PY'
          import json, pathlib, sys
          server, d, skipped = sys.argv[1], pathlib.Path(sys.argv[2]), set(pathlib.Path(sys.argv[3]).read_text().split())
          files = sorted(d.glob("*.json"))
          bad = []
          for f in files:
              text = f.read_text(encoding="utf-8")
              json.loads(text)
              if "\\u0000" in text:
                  bad.append(f.name)
          print(f"{server}: {len(files)} tables parse as JSON")
          # A table upstream has not fixed yet is skipped by design; every other must exist.
          for need in ("activity_table", "building_data", "roguelike_topic_table", "character_table", "skin_table"):
              if need not in skipped and not (d / f"{need}.json").exists():
                  sys.exit(f"{server}: missing {need}.json")
          if bad:
              sys.exit(f"{server}: escaped NULs (a misaligned decode) in: {', '.join(bad)}")
          PY
          done

      - name: Summarise
        if: steps.decide.outputs.run == 'true'
        run: |
          {
            echo "Upstream schemas:"
            echo
            cat "$RUNNER_TEMP/upstream.md"
            echo
            echo "| server | fixed | still failing (upstream lag) | regressed |"
            echo "|---|---|---|---|"
            cat "$RUNNER_TEMP/matrix.md"
            echo
            echo "Every server's gamedata extracts and parses as JSON with no escaped NULs. A table still failing keeps its previous extraction on the VPS until upstream catches up."
            echo
            echo "After merging, run \`vps-update.sh\` on the VPS: it rebuilds the unpacker, and the watcher re-extracts because the binary is newer than \`.last_extract\`."
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR
        id: pr
        if: steps.decide.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: schema-watch/fbs-bump
          title: "chore(unpacker): regenerate FlatBuffer schemas from upstream"
          commit-message: "chore(unpacker): regenerate FlatBuffer schemas from upstream"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            assets/OpenArknightsFBS
            assets/ArknightsFlatbuffers
            assets/unpacker/src
          delete-branch: true

  # A PR opened with GITHUB_TOKEN triggers no pull_request workflows, so Assets CI would never
  # run on it. workflow_dispatch is the one event GITHUB_TOKEN may start, so this job
  # dispatches Assets CI on the PR branch, waits for that exact commit's run, and merges only
  # that commit (--match-head-commit: a push after the run started aborts the merge). Required
  # status checks would do the same for every PR, but Assets CI is path-filtered and would
  # leave unrelated PRs waiting forever.
  automerge:
    name: Merge once Assets CI passes
    needs: watch
    if: >-
      needs.watch.outputs.pr-number != '' &&
      needs.watch.outputs.pr-operation != 'closed' &&
      vars.SCHEMA_WATCH_AUTOMERGE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: schema-watch/fbs-bump
      PR: ${{ needs.watch.outputs.pr-number }}
      SHA: ${{ needs.watch.outputs.pr-sha }}
    steps:
      - name: Run Assets CI on the PR head
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run assets-ci.yml --ref "$BRANCH"
          id=""
          for _ in $(seq 1 30); do
            sleep 10
            id=$(gh run list --workflow assets-ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$SHA\" and .createdAt >= \"$started\")][0].databaseId // empty")
            [ -n "$id" ] && break
          done
          test -n "$id" || { echo "::error::the dispatched Assets CI run for $SHA never appeared"; exit 1; }
          echo "Assets CI: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
          gh run watch "$id" --exit-status --interval 60 > /dev/null

      - name: Merge
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"
