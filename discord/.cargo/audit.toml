# `cargo audit` fails CI on any advisory that is not listed here.
#
# Each entry is an advisory that was looked at and is waiting on an upstream
# release. Delete the entry when its reason stops being true.
# Triaged 2026-11-13.

[advisories]
ignore = [
    # Pulled in by songbird 0.6 (voice): its encryption stack (openmls, hpke-rs,
    # ecdsa) and its audio ring buffer. Nothing in this crate calls them directly,
    # and none has a fix that songbird 0.6.1 accepts; they clear when songbird
    # moves to patched versions.
    "RUSTSEC-2026-0124", # libcrux-chacha20poly1305 0.0.7
    "RUSTSEC-2026-0207", # libcrux-sha3 0.0.8
    "RUSTSEC-2026-0208", # libcrux-sha3 0.0.8
    "RUSTSEC-2026-0209", # libcrux-aesgcm 0.0.7
    "RUSTSEC-2026-0211", # libcrux-aesgcm 0.0.7
    "RUSTSEC-2026-0212", # libcrux-secrets 0.0.5
    "RUSTSEC-2026-0330", # libcrux-kem 0.0.7
    "RUSTSEC-2026-0331", # libcrux-kem 0.0.7
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5
    "RUSTSEC-2026-0293", # ringbuf 0.4.8

    # The bot's own SQLite file, written only by the bot. Needs sqlx to ship a
    # release on libsqlite3-sys 0.39 or later.
    "RUSTSEC-2026-0459", # libsqlite3-sys 0.37.0: bundled SQLite CVE
]
