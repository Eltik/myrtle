[package]
name = "discord"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = { version = "0.6.2", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
dotenvy = "0.15"

serenity = { version = "0.12", default-features = false, features = [
  "builder", "cache", "client", "gateway", "http", "model", "utils",
  "native_tls_backend"
] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = "0.3.32"
unicode-normalization = "0.1.25"

# Text-to-speech in voice channels. Send only: songbird's `receive` feature stays off, and its
# default `rustls` is swapped for `native` to match the rest of the bot's TLS stack.
songbird = { version = "0.6.0", default-features = false, features = [
  "driver", "gateway", "serenity", "native", "tungstenite"
] }
# Songbird leaves symphonia's codecs to the caller: `mp3` decodes Google Translate's speech,
# `ogg` and `vorbis` the operator voice lines `/voiceline` plays.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "ogg", "vorbis"] }
# Songbird's Opus encoder. `bundled` always builds the vendored libopus with CMake and links it
# statically, instead of whichever system libopus pkg-config happens to find first.
opus2 = { version = "0.4.0", features = ["bundled"] }

[profile.dev]
debug = 0
incremental = false
opt-level = 0
