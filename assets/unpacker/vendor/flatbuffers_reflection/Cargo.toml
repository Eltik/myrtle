[package]
name = "flatbuffers-reflection"
version = "0.1.0"
edition = "2021"

[dependencies]
flatbuffers = { path = "../flatbuffers"}
num-traits = "0.2.19"
anyhow = "1.0.75"
thiserror = "1.0"

# MYRTLE PATCH: upstream's generated reflection code trips two rustc lints on
# the current toolchain (11 warnings, none a defect). Silenced here so the
# unpacker build stays warning-free; see ../flatbuffers/MYRTLE-PATCH.md.
[lints.rust]
unused_imports = "allow"
mismatched_lifetime_syntaxes = "allow"
